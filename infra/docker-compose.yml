version: '3.8'

services:
  # 1. PostgreSQL Database (Relational Data & Encrypted Tokens)
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: always
    environment:
      POSTGRES_DB: nexus_platform
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: nexus_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_admin -d nexus_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Neo4j Graph Database (Multi-App Context Graph)
  neo4j:
    image: neo4j:5.18-community
    container_name: nexus-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/nexus_graph_secret_2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - ./neo4j-schema.cypher:/var/lib/neo4j/import/init.cypher
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "nexus_graph_secret_2026", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. MinIO Object Storage (Local S3 Equivalent)
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: nexus-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexus_minio_admin
      MINIO_ROOT_PASSWORD: nexus_minio_secret_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  minio_data:
